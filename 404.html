<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Seite nicht gefunden | Stapelweise</title>
  <!-- Bewusst ohne styles.css: Der Server zeigt diese Seite bei beliebigen
       falschen Adressen, da wuerde ein Verweis auf die CSS-Datei ins Leere gehen. -->
  <style>
    body{margin:0; background:#F5F1E8; color:#172832;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    .kasten{max-width:32em; margin:14vh auto; padding:0 24px;}
    h1{font-size:28px; line-height:1.2; margin:0 0 14px;}
    p{font-size:16px; line-height:1.55; color:#172832b3; margin:0 0 10px;}
    .strich{width:64px; height:3px; background:#E8612C; border-radius:2px; margin-bottom:22px;}
  </style>
</head>
<body>
  <div class="kasten">
    <div class="strich"></div>
    <h1>Diese Seite gibt es nicht.</h1>
    <p>Vielleicht hat sich die Adresse geändert, oder es fehlt ein Zeichen.</p>
    <p>Gehen Sie im Browser einen Schritt zurück.</p>
  </div>
</body>
</html>
